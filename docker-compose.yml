version: "3.8"

services:
  api:
    build: ./api
    env_file:
      - .env
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    environment:
      - FRONTEND_ORIGIN=http://localhost:${FRONTEND_PORT:-3000}
      - API_PORT=${API_PORT:-4000}
    volumes:
      - ./api:/app
      - /app/node_modules
      - ./api/database:/app/database
    networks:
      - app-network

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://localhost:${API_PORT:-4000}/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
